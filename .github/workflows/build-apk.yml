name: Build APK

# Se déclenche à chaque envoi de code sur la branche main,
# et peut aussi être lancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Autoriser l'exécution de Gradle
        run: chmod +x ./gradlew

      - name: Compiler l'APK (debug)
        run: ./gradlew assembleDebug

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: astreinte-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
